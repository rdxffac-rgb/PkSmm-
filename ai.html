<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PkSmm | AI Support</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #fff5f7;
            color: #1a1a1a;
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .fade-in { opacity: 1; }
        .fade-out { opacity: 0; }

        .loader-box {
            position: relative;
            width: 80px;
            height: 80px;
            border-radius: 24px;
            background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px -5px rgba(236, 72, 153, 0.4);
            animation: bounceScale 1.5s ease-in-out infinite;
            overflow: hidden;
        }

        .loader-box img {
            width: 45px;
            height: 45px;
            object-fit: contain;
        }

        .loader-ring {
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 30px;
            border: 2px dashed rgba(236, 72, 153, 0.5);
            animation: rotateRing 4s linear infinite;
        }

        @keyframes bounceScale {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        @keyframes rotateRing {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="flex flex-col items-center justify-center p-6 text-center">
        <div class="relative flex items-center justify-center mb-8">
            <div class="loader-ring"></div>
            <div class="loader-box">
                <img src="ai.png" alt="Logo">
            </div>
        </div>
        
        <h2 class="text-xl font-bold text-gray-900 tracking-tight mb-1">Setting up AI Support</h2>
        <p class="text-sm font-medium text-gray-500">Redirecting in a moment...</p>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            document.body.classList.add('fade-in');
        });

        setTimeout(() => {
            document.body.classList.remove('fade-in');
            document.body.classList.add('fade-out');
            
            setTimeout(() => {
                window.location.href = "https://demo1.xo.je";
            }, 300);
        }, 3000);
    </script>
</body>
</html>
